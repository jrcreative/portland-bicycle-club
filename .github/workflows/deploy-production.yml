name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''
        type: string

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "❌ Deployment cancelled. You must type 'deploy' to confirm."
          exit 1
      
      - name: Confirm branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "❌ Production deployments must be from main branch"
          exit 1

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://portlandbicycleclub.com
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: wp-content/themes/pbc/yarn.lock

      - name: Setup Python 2
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 python2-dev
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install and build pbc theme
        run: |
          cd wp-content/themes/pbc
          yarn install --frozen-lockfile --ignore-scripts
          yarn add node-sass@4.14.1 --ignore-scripts
          npm rebuild node-sass
          yarn build:production
          composer install --no-dev --optimize-autoloader

      - name: Clean up build artifacts and dev files
        run: |
          # Remove all node_modules from themes
          find wp-content/themes -type d -name "node_modules" -exec rm -rf {} + 2>/dev/null || true
          
          # Remove development files from pbc theme
          cd wp-content/themes/pbc
          rm -rf resources/assets/build/
          rm -rf resources/assets/config/
          rm -rf .cache-loader/
          rm -f .babelrc .eslintrc.js .stylelintrc.js
          rm -f webpack.*.js gulpfile.js
          rm -f package.json package-lock.json yarn.lock
          rm -f composer.json composer.lock
          rm -f phpunit.xml* .travis.yml
          
          # Show what we're deploying
          echo "Production files prepared:"
          ls -la dist/ || echo "No dist directory"
          ls -la vendor/ || echo "No vendor directory"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on production
        env:
          PROD_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PROD_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          PROD_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          BACKUP_NAME="backup-$(date +%Y%m%d-%H%M%S).tar.gz"
          ssh ${PROD_USER}@${PROD_HOST} "cd ${PROD_PATH} && tar -czf ../backups/${BACKUP_NAME} wp-content/themes/pbc wp-content/plugins --exclude='node_modules' --exclude='*.log' || mkdir -p ../backups && tar -czf ../backups/${BACKUP_NAME} wp-content/themes/pbc"
          echo "Backup created: ${BACKUP_NAME}"

      - name: Deploy to production via rsync
        env:
          PROD_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PROD_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          PROD_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='wp-content/themes/*/node_modules/' \
            --exclude='wp-content/themes/*/resources/assets/' \
            --exclude='wp-content/themes/*/tests/' \
            --exclude='wp-content/themes/*/.cache-loader/' \
            --exclude='wp-content/uploads/' \
            --exclude='wp-content/cache/' \
            --exclude='wp-content/backups/' \
            --exclude='wp-content/backup-db/' \
            --exclude='wp-content/wflogs/' \
            --exclude='wp-config.php' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='Local Sites/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='webpack.*.js' \
            --exclude='gulpfile.js' \
            --exclude='.eslintrc*' \
            --exclude='.stylelintrc*' \
            --exclude='.babelrc*' \
            --exclude='phpunit.xml*' \
            --exclude='.travis.yml' \
            ./ ${PROD_USER}@${PROD_HOST}:${PROD_PATH}

      - name: Clear WordPress cache
        env:
          PROD_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PROD_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          PROD_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          ssh ${PROD_USER}@${PROD_HOST} "cd ${PROD_PATH} && [ -f wp-cli.phar ] && php wp-cli.phar cache flush || echo 'WP-CLI not found, skipping cache flush'"

      - name: Verify deployment
        env:
          PROD_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PROD_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          PROD_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          ssh ${PROD_USER}@${PROD_HOST} "cd ${PROD_PATH}/wp-content/themes/pbc && ls -la"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ **Production deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Deployed to: \`${{ secrets.PRODUCTION_SERVER_HOST }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Backup created on server" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Production deployment failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs above for error details." >> $GITHUB_STEP_SUMMARY
          fi
