name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify secrets are set
        env:
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          STAGING_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          echo "Checking required secrets..."
          
          if [ -z "$STAGING_USER" ]; then
            echo "❌ STAGING_SSH_USER is not set"
            exit 1
          else
            echo "✓ STAGING_SSH_USER is set"
          fi
          
          if [ -z "$STAGING_HOST" ]; then
            echo "❌ STAGING_SERVER_HOST is not set"
            exit 1
          else
            echo "✓ STAGING_SERVER_HOST is set"
          fi
          
          if [ -z "$STAGING_PATH" ]; then
            echo "❌ STAGING_DEPLOY_PATH is not set"
            exit 1
          else
            echo "✓ STAGING_DEPLOY_PATH is set"
          fi
          
          if [ -z "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ STAGING_SSH_PRIVATE_KEY is not set"
            exit 1
          else
            echo "✓ STAGING_SSH_PRIVATE_KEY is set"
          fi
          
          echo ""
          echo "All required secrets are configured!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install and build pbc theme
        run: |
          cd wp-content/themes/pbc
          
          # Install dependencies (package.json now uses dart-sass)
          yarn install
          
          # Build the theme
          yarn build:production
          
          # Install PHP dependencies
          composer install --no-dev --optimize-autoloader

      - name: Clean up build artifacts and dev files
        run: |
          # Remove all node_modules from themes
          find wp-content/themes -type d -name "node_modules" -exec rm -rf {} + 2>/dev/null || true
          
          # Remove development files from pbc theme
          cd wp-content/themes/pbc
          rm -rf resources/assets/build/
          rm -rf resources/assets/config/
          rm -rf .cache-loader/
          rm -f .babelrc .eslintrc.js .stylelintrc.js
          rm -f webpack.*.js gulpfile.js
          rm -f package.json package-lock.json yarn.lock
          rm -f composer.json composer.lock
          rm -f phpunit.xml* .travis.yml
          
          # Keep only built files
          echo "Keeping only production files..."
          ls -la dist/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        env:
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_HOST: ${{ secrets.STAGING_SERVER_HOST }}
        run: |
          echo "Testing SSH connection..."
          ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${STAGING_USER}@${STAGING_HOST} "echo 'SSH connection successful'; pwd" || {
            echo "❌ SSH connection failed!"
            echo "Troubleshooting steps:"
            echo "1. Verify STAGING_SSH_PRIVATE_KEY secret is set in GitHub"
            echo "2. Verify public key is in ~/.ssh/authorized_keys on server"
            echo "3. Test locally: ssh -p 2222 -i ~/.ssh/your_key ${STAGING_USER}@${STAGING_HOST}"
            echo "4. Check server firewall allows port 2222"
            exit 1
          }

      - name: Add server to known hosts
        env:
          STAGING_HOST: ${{ secrets.STAGING_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$STAGING_HOST" ]; then
            echo "Error: STAGING_SERVER_HOST secret is not set"
            exit 1
          fi
          ssh-keyscan -p 2222 -H $STAGING_HOST >> ~/.ssh/known_hosts 2>&1 || {
            echo "Warning: ssh-keyscan failed, disabling strict host checking"
            echo "Host *" >> ~/.ssh/config
            echo "  StrictHostKeyChecking no" >> ~/.ssh/config
            echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
            echo "  Port 2222" >> ~/.ssh/config
          }

      - name: Verify plugin vendor directories before deploy
        run: |
          echo "Verifying plugin vendor directories exist in git..."
          ls -la wp-content/plugins/woocommerce-memberships-for-teams/vendor/ || echo "❌ woocommerce-memberships-for-teams vendor missing!"
          ls -la wp-content/plugins/woocommerce-memberships-for-teams/vendor/woocommerce/action-scheduler/action-scheduler.php || echo "❌ action-scheduler.php missing!"
          ls -la wp-content/plugins/woocommerce-memberships/vendor/ || echo "❌ woocommerce-memberships vendor missing!"
          ls -la wp-content/plugins/simple-local-avatars/vendor/ || echo "❌ simple-local-avatars vendor missing!"
          echo "✓ Vendor directories verified"

      - name: Deploy to staging via rsync
        env:
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          STAGING_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          echo "Starting rsync deployment..."
          echo "Plugin vendor directories that will be synced:"
          find wp-content/plugins/*/vendor -type d -maxdepth 0 2>/dev/null || echo "No plugin vendor directories found"
          
          rsync -avz --delete -e "ssh -p 2222" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='wp-content/themes/*/node_modules/' \
            --exclude='wp-content/themes/*/resources/assets/' \
            --exclude='wp-content/themes/*/tests/' \
            --exclude='wp-content/themes/*/.cache-loader/' \
            --exclude='wp-content/mu-plugins/' \
            --exclude='wp-content/plugins/wordkeeper*' \
            --exclude='wp-content/uploads/' \
            --exclude='wp-content/cache/' \
            --exclude='wp-content/backups/' \
            --exclude='wp-content/backup-db/' \
            --exclude='wp-content/wflogs/' \
            --exclude='wp-config.php' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='Local Sites/' \
            --exclude='wp-content/themes/*/package.json' \
            --exclude='wp-content/themes/*/package-lock.json' \
            --exclude='wp-content/themes/*/yarn.lock' \
            --exclude='wp-content/themes/*/composer.json' \
            --exclude='wp-content/themes/*/composer.lock' \
            --exclude='wp-content/themes/*/webpack.*.js' \
            --exclude='wp-content/themes/*/gulpfile.js' \
            --exclude='wp-content/themes/*/.eslintrc*' \
            --exclude='wp-content/themes/*/.stylelintrc*' \
            --exclude='wp-content/themes/*/.babelrc*' \
            --exclude='wp-content/themes/*/phpunit.xml*' \
            --exclude='wp-content/themes/*/.travis.yml' \
            ./ ${STAGING_USER}@${STAGING_HOST}:${STAGING_PATH}
          
          echo "✓ Rsync completed"

      - name: Verify deployment on staging server
        env:
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          STAGING_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          echo "Verifying vendor directories on staging server..."
          ssh -p 2222 ${STAGING_USER}@${STAGING_HOST} "
            cd ${STAGING_PATH}
            echo 'Checking for action-scheduler.php...'
            if [ -f wp-content/plugins/woocommerce-memberships-for-teams/vendor/woocommerce/action-scheduler/action-scheduler.php ]; then
              echo '✓ action-scheduler.php exists on staging'
            else
              echo '❌ action-scheduler.php missing on staging!'
              exit 1
            fi
            
            echo 'Checking vendor directory structure...'
            ls -la wp-content/plugins/woocommerce-memberships-for-teams/vendor/woocommerce/ || echo 'Vendor directory missing or empty'
          "

      - name: Clear WordPress cache on staging
        env:
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          STAGING_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh -p 2222 ${STAGING_USER}@${STAGING_HOST} "cd ${STAGING_PATH} && [ -f wp-cli.phar ] && php wp-cli.phar cache flush || echo 'WP-CLI not found, skipping cache flush'"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ **Staging deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Deployed to: \`${{ secrets.STAGING_SERVER_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Staging deployment failed!**" >> $GITHUB_STEP_SUMMARY
          fi
