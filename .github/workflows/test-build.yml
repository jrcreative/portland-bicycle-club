name: Test Build

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Test Theme Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: wp-content/themes/pbc/yarn.lock

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install dependencies
        run: |
          cd wp-content/themes/pbc
          
          # Install dependencies without running build scripts
          yarn install --frozen-lockfile --ignore-scripts
          
          # Manually download prebuilt node-sass binary for Node.js 20 (binding 72)
          mkdir -p node_modules/node-sass/vendor/linux-x64-72
          curl -L https://github.com/sass/node-sass/releases/download/v4.12.0/linux-x64-72_binding.node \
            -o node_modules/node-sass/vendor/linux-x64-72/binding.node
          
          composer install

      - name: Test build
        run: |
          cd wp-content/themes/pbc
          yarn build:production

      - name: Build Summary
        run: |
          echo "## Build Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
